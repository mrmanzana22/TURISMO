<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <title>TripFinder CO - Reservas</title>
  <link href="/static/css/styles.css?v=2" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">TripFinder CO</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <div class="navbar-nav ms-auto align-items-center gap-2">
          <a class="btn btn-outline-primary" href="/" id="nav-explorar">Explorar</a>
          <div class="btn-group" role="group" aria-label="Idioma">
            <button class="btn btn-sm btn-outline-secondary" id="lang-es" onclick="setLanguage('es')">ES</button>
            <button class="btn btn-sm btn-outline-secondary" id="lang-en" onclick="setLanguage('en')">EN</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 id="reservas-title" class="mb-3">Mis Reservas</h1>
    <div id="reservas-list" class="mt-2"></div>
    <hr class="my-4">
    <div class="site-footer">TripFinder CO - Tus reservas se guardan en tu navegador</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  <script src="/static/js/app.js?v=4"></script>
</body>
</html>
