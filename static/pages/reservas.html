<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>App Turística - Reservas</title>
  <link href="/static/css/styles.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">App Turística</a>
      <div class="d-flex align-items-center">
        <a class="btn btn-outline-primary me-2" href="/" id="nav-explorar">Explorar</a>
        <div class="btn-group" role="group" aria-label="Idioma">
          <button class="btn btn-sm btn-outline-secondary" id="lang-es" onclick="setLanguage('es')">ES</button>
          <button class="btn btn-sm btn-outline-secondary" id="lang-en" onclick="setLanguage('en')">EN</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="container my-4">
    <h1 id="reservas-title" class="mb-3">Mis Reservas</h1>
    <div id="reservas-list" class="mt-2"></div>
    <hr class="my-4">
    <div class="site-footer">Reservas guardadas localmente en el servidor</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
  <script src="/static/js/app.js?v=2"></script>
</body>
</html>
